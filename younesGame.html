<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon City Defender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="hud-title">NEON_CITY_DEFENDER_v1.0</div>
        <div class="hud-status">
            <div class="status-item">
                <span>TIME TO BREACH</span>
                <div class="timer-alert">00:45</div>
            </div>
            <div class="status-item">
                <span>SHIELD INTEGRITY</span>
                <div class="shield-good">100%</div>
            </div>
            <div class="status-item">
                <span>SCORE</span>
                <div class="score-val">0000</div>
            </div>
        </div>
    </header>

    <main>
        <section class="feed-container">
            <!-- Cards spawned dynamically by main.js -->
        </section>

        <aside class="sidebar">
            <div class="terminal-log">
                <!-- Log entries added dynamically by main.js -->
            </div>
            <div class="system-specs">
                <p>TARGET: NEON_CITY_GRID_04</p>
                <p>THREAT LEVEL: ELEVATED</p>
            </div>
        </aside>
    </main>

    <script src="main.js"></script>
    <script>
        // Start game overlay initialization
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof showOverlay === 'function') {
                showOverlay("SYSTEM READY", ["Threat payloads incoming.", "Sort real core patches from fake ads."], "INITIALIZE SHIELD");
            }
        });
    </script>
</body>
</html>
